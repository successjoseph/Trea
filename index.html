<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Trea - a serverless treasury dashboard for small organisations.">
    <meta name="theme-color" content="#0f172a">
    <title>Trea · Treasury</title>

    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%A6%3C/text%3E%3C/svg%3E">

    <script>
        // Applied before first paint so a dark-mode user never sees a white flash.
        (function () {
            try {
                var pref = localStorage.getItem('trea:theme');
                var dark = pref === 'dark' || (!pref && window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (dark) document.documentElement.classList.add('dark');
            } catch (e) { /* storage blocked; default to light */ }
        })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' };</script>
    <script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"
        integrity="sha384-vtjasyidUo0kW94K5MXDXntzOJpQgBKXmE7e2Ga4LG0skTTLeBi97eFAXsqewJjw"
        crossorigin="anonymous"></script>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans antialiased">

    <!--
        Everything below used to be static markup toggled with the `hidden`
        class by root app.js. It is now rendered by <App/> (src/App.tsx):
        the auth gate by src/auth/AuthGate.tsx, the dashboard shell by
        src/legacy/LegacyShell.tsx. See docs/react-migration.md.
    -->
    <noscript>
        <div class="fixed inset-0 z-[200] bg-slate-900 text-white flex items-center justify-center p-8 text-center">
            Trea needs JavaScript to read and reconcile your ledger.
        </div>
    </noscript>

    <div id="root" class="h-full"></div>

    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
